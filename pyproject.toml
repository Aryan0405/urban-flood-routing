[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflood"
version = "0.1.0"
description = "SYNTHETIC urban flood simulation and risk-aware routing engine (no real-world data)"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
